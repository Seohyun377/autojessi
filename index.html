  <style>/* styles.css — tokens, theming, app shell, listing page */

:root {
  --font: "Pretendard", "Pretendard Variable", -apple-system, system-ui, sans-serif;
  --mono: "Pretendard", "Pretendard Variable", -apple-system, system-ui, sans-serif;

  --paper: oklch(0.985 0.004 95);
  --surface: #fff;
  --surface-2: oklch(0.975 0.004 95);
  --surface-3: oklch(0.96 0.005 95);
  --ink: oklch(0.24 0.012 265);
  --ink-2: oklch(0.47 0.012 265);
  --ink-3: oklch(0.63 0.01 265);
  --line: #EDEDED;
  --line-2: oklch(0.86 0.006 265);

  --accent: #2552e0;
  --accent-ink: #fff;
  --accent-weak: color-mix(in oklab, var(--accent) 10%, var(--surface));
  --accent-line: color-mix(in oklab, var(--accent) 28%, var(--surface));

  --live: oklch(0.6 0.2 27);
  --live-weak: oklch(0.6 0.2 27 / 0.1);
  --good: oklch(0.56 0.13 152);
  --good-weak: oklch(0.56 0.13 152 / 0.12);
  --warn: oklch(0.7 0.15 70);

  --shadow-sm: 0 1px 2px oklch(0.2 0.02 265 / 0.05), 0 1px 1px oklch(0.2 0.02 265 / 0.04);
  --shadow-md: 0 4px 16px oklch(0.2 0.02 265 / 0.08), 0 1px 3px oklch(0.2 0.02 265 / 0.06);
  --shadow-lg: 0 12px 40px oklch(0.2 0.02 265 / 0.16), 0 2px 8px oklch(0.2 0.02 265 / 0.08);

  --r-sm: 8px; --r: 12px; --r-lg: 16px; --r-xl: 22px;
  --card-min: 280px;
  --maxw: 1260px;
}

[data-theme="dark"] {
  --paper: oklch(0.165 0.008 265);
  --surface: oklch(0.205 0.009 265);
  --surface-2: oklch(0.235 0.01 265);
  --surface-3: oklch(0.27 0.011 265);
  --ink: oklch(0.95 0.004 95);
  --ink-2: oklch(0.74 0.01 265);
  --ink-3: oklch(0.58 0.01 265);
  --line: oklch(1 0 0 / 0.09);
  --line-2: oklch(1 0 0 / 0.15);
  --accent-weak: color-mix(in oklab, var(--accent) 22%, var(--surface));
  --accent-line: color-mix(in oklab, var(--accent) 45%, var(--surface));
  --live: oklch(0.68 0.18 30);
  --live-weak: oklch(0.68 0.18 30 / 0.16);
  --good: oklch(0.66 0.13 152);
  --shadow-sm: 0 1px 2px #0006;
  --shadow-md: 0 4px 16px #0007;
  --shadow-lg: 0 16px 48px #0009;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: var(--font);
  background: var(--paper);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  letter-spacing: -0.005em;
}
.mono { font-family: var(--mono); font-feature-settings: "tnum" 1; letter-spacing: -0.01em; }
.muted { color: var(--ink-3); }
.sep { color: var(--line-2); margin: 0 1px; }
button { font-family: inherit; cursor: pointer; }
h1, h2, h3 { margin: 0; letter-spacing: -0.02em; }
::selection { background: color-mix(in oklab, var(--accent) 25%, transparent); }

.app { min-height: 100vh; }
.wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 28px; }

/* ── nav ───────────────────────────────────────────────────────────────── */
.nav {
  position: sticky; top: 0; z-index: 40;
  background: color-mix(in oklab, var(--paper) 82%, transparent);
  -webkit-backdrop-filter: blur(18px) saturate(160%);
  backdrop-filter: blur(18px) saturate(160%);
  border-bottom: 1px solid var(--line);
}
.nav-inner { max-width: var(--maxw); margin: 0 auto; padding: 0 28px; height: 66px;
  display: flex; align-items: center; gap: 28px; }
.brand { display: flex; align-items: center; gap: 11px; cursor: pointer; }
.brand-logo { height: 20px; width: auto; display: block; }
.brand-mark { width: 32px; height: 32px; border-radius: 9px; background: var(--ink);
  color: var(--paper); display: grid; place-items: center; flex-shrink: 0; }
.brand-mark svg { transform: rotate(-12deg); }
.brand-txt { display: flex; flex-direction: column; line-height: 1.05; }
.brand-name { font-weight: 800; font-size: 16px; letter-spacing: -0.03em; }
.brand-sub { font-size: 9.5px; letter-spacing: 0.18em; color: var(--ink-3);
  font-family: var(--mono); text-transform: uppercase; }
.nav-links { display: flex; align-items: center; gap: 4px; }
.nav-link { border: 0; background: transparent; color: var(--ink-2); font-size: 14px;
  font-weight: 500; padding: 8px 13px; border-radius: var(--r-sm); display: flex;
  align-items: center; gap: 6px; transition: .15s; white-space: nowrap; }
.nav-link:hover { background: var(--surface-2); color: var(--ink); }
.nav-link.on { color: var(--ink); background: var(--surface-3); }
.nav-link .pill { font-family: var(--mono); font-size: 11px; background: var(--accent);
  color: var(--accent-ink); border-radius: 99px; padding: 1px 6px; }
.nav-spacer { flex: 1; }
.nav-right { display: flex; align-items: center; gap: 6px; }
.nav-ic { border: 0; background: transparent; color: var(--ink); width: 38px; height: 38px;
  display: grid; place-items: center; border-radius: 50%; transition: .15s; cursor: pointer; }
.nav-ic:hover { background: var(--surface-2); }
.nav-ic.on { background: var(--surface-3); }
.cur-wrap { position: relative; }
.cur-menu { position: absolute; top: calc(100% + 8px); right: 0; z-index: 50;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 6px;
  box-shadow: var(--shadow-md); min-width: 108px; display: flex; flex-direction: column; gap: 2px; }
.cur-menu-item { display: flex; align-items: center; justify-content: space-between; border: 0;
  background: transparent; color: var(--ink-2); font-size: 13px; font-weight: 600; padding: 9px 11px;
  border-radius: var(--r-sm); transition: .12s; }
.cur-menu-item:hover { background: var(--surface-2); }
.cur-menu-item.on { color: var(--ink); background: var(--surface-3); }
.cur-menu-item svg { color: var(--accent); }
.nav-burger { display: none; border: 0; background: transparent; color: var(--ink);
  width: 44px; height: 44px; align-items: center; justify-content: center;
  border-radius: var(--r-sm); transition: .15s; cursor: pointer; }
.nav-burger:hover { background: var(--surface-2); }
.nav-mobile { display: none; }
.cur-mini { display: flex; gap: 0; border: 1px solid var(--line-2); border-radius: 99px;
  overflow: hidden; }
.cur-mini button { border: 0; background: transparent; color: var(--ink-3);
  font-family: var(--mono); font-size: 11.5px; padding: 5px 9px; transition: .12s; }
.cur-mini button.on { background: var(--ink); color: var(--paper); }
.btn-login { border: 0; background: transparent;
  color: var(--ink); font-weight: 600; font-size: 14px; padding: 8px 10px;
  border-radius: var(--r-sm); display: flex; align-items: center; gap: 7px; transition: .15s; }
.btn-login:hover { background: var(--surface-2); }
.avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--accent);
  color: var(--accent-ink); display: grid; place-items: center; font-weight: 700;
  font-size: 13px; border: 0; cursor: pointer; transition: .15s; }
.avatar.on, .avatar:hover { box-shadow: 0 0 0 3px var(--accent-weak); }
.avatar-wrap { position: relative; }
.avatar-menu { position: absolute; top: calc(100% + 10px); right: 0; z-index: 60; min-width: 268px;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg);
  box-shadow: var(--shadow-lg); padding: 10px; animation: avMenuIn .14s ease; }
@keyframes avMenuIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
.am-label { font-size: 12px; font-weight: 600; color: var(--ink-3); padding: 4px 8px 8px; }
.am-label-mt { padding-top: 12px; }
.am-account { display: flex; align-items: center; gap: 12px; padding: 12px; border: 1.5px solid var(--accent);
  border-radius: var(--r-lg); background: var(--accent-weak); margin-bottom: 4px; }
.am-acct-avatar { width: 44px; height: 44px; flex-shrink: 0; border-radius: 50%;
  background: linear-gradient(150deg, oklch(0.78 0.09 230), oklch(0.66 0.11 235));
  color: #fff; display: grid; place-items: center; font-size: 18px; font-weight: 700; }
.am-acct-info { flex: 1; min-width: 0; }
.am-acct-name { font-size: 14.5px; font-weight: 700; color: var(--ink); line-height: 1.25; }
.am-acct-type { font-size: 12px; color: var(--ink-2); margin-top: 1px; }
.am-acct-email { font-size: 11.5px; color: var(--ink-3); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.am-account > svg { flex-shrink: 0; color: var(--accent); stroke-width: 2.6; }
.avatar-mi { display: flex; align-items: center; gap: 11px; width: 100%; text-align: left;
  border: 0; background: transparent; border-radius: var(--r-sm); padding: 10px 12px;
  font-size: 14px; font-weight: 600; color: var(--ink); cursor: pointer; transition: .12s; }
.avatar-mi svg { color: var(--ink-3); flex-shrink: 0; }
.avatar-mi:hover { background: var(--accent-weak); color: var(--accent); }
.avatar-mi:hover svg { color: var(--accent); }
.avatar-mi-badge { margin-left: auto; font-size: 11px; font-weight: 700; color: var(--accent);
  background: var(--accent-weak); border-radius: 99px; min-width: 19px; height: 19px; padding: 0 6px;
  display: inline-grid; place-items: center; }
.avatar-mi.danger { color: var(--ink-2); }
.avatar-mi.danger:hover { background: var(--live-weak); color: var(--live); }
.avatar-mi.danger:hover svg { color: var(--live); }
.avatar-sep { height: 1px; background: var(--line); margin: 6px 8px; }

.mp-sec-title { display: flex; align-items: center; gap: 10px; font-size: 28px; font-weight: 800; }
.mp-sec-title svg { color: var(--accent); }
.mp-sec-n { font-family: var(--mono); font-size: 15px; font-weight: 700; color: #fff; background: var(--accent);
  border-radius: 99px; min-width: 28px; height: 26px; padding: 0 9px; display: inline-grid; place-items: center; }

/* ── page ──────────────────────────────────────────────────────────────── */
.page { padding: 34px 0 80px; }
.listing-head { display: flex; flex-direction: column; align-items: stretch;
  margin-bottom: 22px; }
.hero-search { display: flex; align-items: center; gap: 12px; width: 100%; max-width: 680px;
  margin: 26px auto 34px; border-bottom: 2px solid var(--ink); padding: 10px 4px 14px; color: var(--ink-3); }
.hero-search input { flex: 1; border: 0; background: transparent; outline: none; font: inherit;
  font-size: 21px; font-weight: 500; color: var(--ink); letter-spacing: -0.01em; }
.hero-search input::placeholder { color: var(--ink-3); font-weight: 500; }
.hero-search svg { color: var(--ink-2); flex-shrink: 0; }
.market-desc { justify-content: center; }
.page-title { font-size: 30px; font-weight: 800; }
.page-sub { margin: 8px 0 0; color: var(--ink-2); font-size: 14.5px; }
.page-sub b { color: var(--ink); }
.soon-flag { color: var(--live); font-weight: 600; display: inline-flex; align-items: center; gap: 3px; }
.soon-flag svg { vertical-align: -1px; }

/* tabs */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
.tab { border: 0; background: transparent; color: var(--ink-3); font-size: 14px;
  font-weight: 600; padding: 11px 14px; position: relative; transition: .15s; white-space: nowrap; }
.tab:hover { color: var(--ink-2); }
.tab.on { color: var(--ink); }
.tab.on::after { content: ""; position: absolute; left: 8px; right: 8px; bottom: -1px;
  height: 2.5px; background: var(--accent); border-radius: 99px; }

/* toolbar */

/* countdown big */

/* bid form */

/* auto bid */

/* history */

.btn-google { width: 100%; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink);
  height: 48px; border-radius: var(--r-sm); font-size: 14px; font-weight: 600; display: flex;

.modal-divider { display: flex; align-items: center; gap: 12px; margin: 16px 0; color: var(--ink-3); font-size: 11.5px; }

  font-size: 13.5px; padding: 8px; border-radius: 7px; transition: .12s; }

/* ── auth (signup / login) ── */
.auth-modal { display: flex; flex-direction: column; max-height: calc(100vh - 40px); }

.auth-body { flex: 1; overflow-y: auto; margin: 0 -30px -30px; padding: 0 30px 30px; }

  align-items: center; text-align: left; padding: 16px; border: 1px solid var(--line-2);

  background: var(--surface-2); border-radius: 9px; color: var(--ink-2); font-size: 12.5px; }

.asset-edit-modal { max-width: 720px; padding: 26px 28px; display: flex; flex-direction: column; height: 720px; max-height: calc(100vh - 40px); }
